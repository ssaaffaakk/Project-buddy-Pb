version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    ignore:
      # gunicorn majors past 23 removed the eventlet worker class that the
      # Flask-SocketIO stack depends on (Procfile/render.yaml use
      # `--worker-class eventlet`). Bumping past 23.x crashes the deploy.
      - dependency-name: gunicorn
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci

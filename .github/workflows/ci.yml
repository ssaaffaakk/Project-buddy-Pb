name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = local dev floor, 3.11 = production runtime (runtime.txt)
        python-version: ["3.9", "3.11"]
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere
      SEED_MOCK_DATA: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Coverage floor is a ratchet: raise it as coverage grows, never lower it.
      - run: pytest --cov=. --cov-report=term-missing --cov-fail-under=35

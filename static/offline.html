<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060B1A">
  <title>Offline — ProjectBuddy</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:#060B1A;color:#EEF1FF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;text-align:center;padding:32px;gap:20px;
    }
    img{width:88px;height:88px;border-radius:20px;}
    h1{font-size:1.5rem;font-weight:600;letter-spacing:-0.01em;}
    p{color:#9AA3CC;max-width:32ch;line-height:1.55;font-size:0.95rem;}
    button{
      margin-top:8px;padding:13px 26px;border:none;border-radius:99px;cursor:pointer;
      font-size:0.9rem;font-weight:600;color:#fff;
      background:linear-gradient(120deg,#7C9BFF,#A78BFF,#FF6B6B);
      -webkit-tap-highlight-color:transparent;
    }
    button:active{transform:scale(0.97);}
  </style>
</head>
<body>
  <img src="/static/images/icon-192.png" alt="ProjectBuddy">
  <h1>You're offline</h1>
  <p>ProjectBuddy needs a connection for this page. Check your network and try again.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>

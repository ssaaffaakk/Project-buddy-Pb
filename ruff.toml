# Ruff configuration — enforced in CI (.github/workflows/ci.yml)
line-length = 120
target-version = "py39"
exclude = ["migrations", "venv", ".venv", "frontend"]

[lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",                # pyflakes (unused imports, undefined names, dup keys)
    "B",                # flake8-bugbear (common bugs and design problems)
    "I",                # isort (import sorting)
    "UP",               # pyupgrade (Python version modernization)
    "SIM",              # flake8-simplify
    "C4",               # flake8-comprehensions
]
ignore = [
    # E712: `== True` / `== False` comparisons are required syntax in SQLAlchemy
    # filter expressions (they compile to SQL); `is` would break the query.
    "E712",
    # UP036: version blocks are used intentionally for compatibility guards.
    "UP036",
    # B904: raise-without-from — existing patterns, fix incrementally.
    "B904",
    # SIM105: suppressible-exception — existing try/except/pass patterns.
    "SIM105",
    # SIM102: collapsible-if — readability is subjective, fix incrementally.
    "SIM102",
    # SIM103: needless-bool — existing patterns, fix incrementally.
    "SIM103",
]

[lint.isort]
known-first-party = ["routes", "services", "models", "extensions", "config"]

[lint.per-file-ignores]
# wsgi.py: eventlet.monkey_patch() MUST run before any other import.
"wsgi.py" = ["E402"]
# seed_mock.py: sets up sys.path / env before importing the app.
"seed_mock.py" = ["E402"]

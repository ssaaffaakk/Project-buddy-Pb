# Ruff configuration — enforced in CI (.github/workflows/ci.yml)
line-length = 120
target-version = "py39"
exclude = ["migrations", "venv", ".venv"]

[lint]
# E4/E7/E9: pycodestyle errors · F: pyflakes (unused imports, undefined names, dup keys)
select = ["E4", "E7", "E9", "F"]
# E712: `== True` / `== False` comparisons are required syntax in SQLAlchemy
# filter expressions (they compile to SQL); `is` would break the query.
ignore = ["E712"]

[lint.per-file-ignores]
# wsgi.py: eventlet.monkey_patch() MUST run before any other import.
"wsgi.py" = ["E402"]
# seed_mock.py: sets up sys.path / env before importing the app.
"seed_mock.py" = ["E402"]

# Full local stack: web + PostgreSQL + Redis — mirrors production topology.
#   docker compose up --build
# App:  http://localhost:5001   (admin login uses ADMIN_EMAIL / ADMIN_PASSWORD)
services:
  web:
    build: .
    ports:
      - "5001:5001"
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      FLASK_ENV: production
      SQLALCHEMY_DATABASE_URI: postgresql://projectbuddy:projectbuddy@db:5432/projectbuddy
      REDIS_URL: redis://redis:6379/0
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      SEED_MOCK_DATA: ${SEED_MOCK_DATA:-true}
      MOCK_PASSWORD: ${MOCK_PASSWORD:-Mock@123}
      CELERY_BROKER_URL: redis://redis:6379/1
      METRICS_TOKEN: ${METRICS_TOKEN:-local-dev-token}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A celery_worker.celery worker --beat --loglevel=info
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      FLASK_ENV: production
      SQLALCHEMY_DATABASE_URI: postgresql://projectbuddy:projectbuddy@db:5432/projectbuddy
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      SEED_MOCK_DATA: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: projectbuddy
      POSTGRES_PASSWORD: projectbuddy
      POSTGRES_DB: projectbuddy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectbuddy"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Observability (opt-in): docker compose --profile observability up ──────
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
